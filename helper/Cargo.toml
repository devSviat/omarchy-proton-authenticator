[package]
name = "pa-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"

[lib]
name = "pa_helper"
path = "src/lib.rs"

[[bin]]
name = "pa-helper"
path = "src/main.rs"

[dependencies]
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
zeroize = { version = "1.9.1", features = ["serde"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
