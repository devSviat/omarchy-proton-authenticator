name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  helper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --locked --features budget-probe -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features budget-probe
      - run: cargo test --locked --release --features budget-probe --test budget
      - name: No SQLite in the shipped helper
        run: |
          if cargo tree --locked -e normal | grep -i sqlite; then
            echo "SQLite is a normal dependency of the helper" >&2
            exit 1
          fi
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          manifest-path: helper/Cargo.toml
          arguments: --locked

  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.89.0
      - run: cargo build --locked --release
      - run: cargo test --locked --no-run --features budget-probe

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Node 22+ treats a bare directory argument as a module path.
      - run: node --test tests/*.test.mjs
      - name: Helper version matches the manifest
        run: |
          node -e '
            const fs = require("fs")
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8")).version
            const cargo = fs.readFileSync("helper/Cargo.toml", "utf8")
              .match(/^\[package\][^[]*?^version = "([^"]+)"/m)[1]
            if (manifest !== cargo) {
              console.error(`manifest.json ${manifest} != helper/Cargo.toml ${cargo}`)
              process.exit(1)
            }
          '
      - run: bash -n install.sh
